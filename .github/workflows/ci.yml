name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Backend, Python SDK and acceptance tests (real PostgreSQL, Qdrant, embeddings)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets
        run: python3 scripts/generate_env.py > /dev/null

      - name: No secrets committed
        run: python3 scripts/check_secrets.py

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Backend tests
        run: docker compose exec -T backend pytest -q

      - name: Python SDK tests
        run: docker compose exec -T -w /opt/sdk backend python -m pytest -q -p no:cacheprovider tests

      - name: Acceptance scenario (16 steps against the running deployment)
        run: docker compose exec -T backend python /opt/scripts/acceptance_test.py

      - name: Service logs
        if: failure()
        run: docker compose logs --tail 200

  frontend:
    name: Dashboard build (type check + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  sdk-js:
    name: TypeScript SDK tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  production-config:
    name: Production configuration (compose, Caddy, nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate a production .env
        run: python3 scripts/generate_env.py --production --domain ci.example.com > /dev/null
      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate the Caddyfile
        run: >
          docker run --rm -e DOMAIN=ci.example.com
          -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate the nginx configuration with the production real-IP settings
        run: >
          docker run --rm --add-host backend:127.0.0.1
          -v "$PWD/infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/infrastructure/nginx/real-ip.conf:/etc/nginx/conf.d/00-real-ip.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Shell scripts
        run: bash -n scripts/deploy.sh && bash -n scripts/backup.sh
