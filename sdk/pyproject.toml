[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memory-sdk"
version = "1.1.0"
description = "Python SDK for AI agents to use the Shared Memory Layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
sml = "shared_memory.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shared_memory*"]
