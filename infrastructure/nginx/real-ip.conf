# Production only (mounted by docker-compose.prod.yml): nginx sits behind Caddy on
# the private Docker network, so the client address is the one Caddy reports in
# X-Forwarded-For. Only private (Docker) addresses are trusted as proxies.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
