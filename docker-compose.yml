name: shared-memory-layer

# Secrets come from `.env` (see .env.example / scripts/generate_env.py).
# `${VAR:?message}` makes compose fail fast when a required secret is missing.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run scripts/generate_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-shared_memory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is not set - run scripts/generate_env.py}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget; probe the HTTP port with bash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sml}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shared_memory}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sml}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shared_memory}_test
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run scripts/generate_env.py}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      # evaluation reports written by evaluation/run_evaluation.py
      - ./evaluation/results:/opt/evaluation/results
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  # Optional local LLM. Enable with:  docker compose --profile llm up -d
  # then set LLM_PROVIDER=ollama and LLM_MODEL=<model> in .env and pull the model:
  #   docker compose exec ollama ollama pull qwen2.5:0.5b
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
